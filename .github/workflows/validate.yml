name: Validate marketplace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # --strict fails on the "no plugins defined" warning, so it is only
      # enabled once the marketplace lists at least one plugin.
      - name: Validate marketplace manifest
        shell: bash
        run: |
          if [ "$(jq '.plugins | length' .claude-plugin/marketplace.json)" -gt 0 ]; then
            claude plugin validate . --strict
          else
            claude plugin validate .
          fi

      # Validating the marketplace does not open component files of each
      # plugin, so every plugin directory is validated separately.
      - name: Validate each plugin
        shell: bash
        run: |
          shopt -s nullglob
          status=0
          for dir in plugins/*/; do
            echo "::group::$dir"
            claude plugin validate "$dir" --strict || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Marketplace policy checks
        run: node scripts/validate-marketplace.mjs

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # What's New is built from git history

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build
